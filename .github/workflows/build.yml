name: Build and Deploy
on: [push]

jobs:


  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller --name wincurl --onefile --windowed --add-data "icon.png;." main.py
      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: wincurl-windows
          path: dist/wincurl.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller --name wincurl --onefile --windowed --add-data "icon.png:." main.py
      - name: Upload Mac Binary
        uses: actions/upload-artifact@v4
        with:
          name: wincurl-mac
          path: dist/wincurl.app

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller --name wincurl --onefile --windowed --add-data "icon.png:." main.py
      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: wincurl-linux
          path: dist/wincurl

  deploy-itch:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      ITCH_TARGET: jayjayivanygmailcom/wincurl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Install Butler
        run: |
          curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "BUTLER_API_KEY secret is not set. Skipping itch.io deployment."
            exit 0
          fi
          ./butler push artifacts/wincurl-windows $ITCH_TARGET:windows
          ./butler push artifacts/wincurl-mac $ITCH_TARGET:mac
          ./butler push artifacts/wincurl-linux $ITCH_TARGET:linux
          ./butler push wincurl_latest.apk $ITCH_TARGET:android
