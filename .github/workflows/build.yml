name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: pip3 install --user --upgrade buildozer

      - name: Pre-initialize Buildozer
        run: |
          # This triggers the initial SDK download setup without building
          yes | buildozer android update
        env:
          BUILDOZER_ACCEPT_SDK_LICENSE: 1

      - name: Accept Licenses
        run: |
          # Manually accept licenses for any remaining components
          yes | sdkmanager --licenses || true
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          PATH: /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin:$PATH
          BUILDOZER_ACCEPT_SDK_LICENSE: 1

      - name: Build with Buildozer
        run: |
          # Now that SDK is setup and licenses accepted, run the build
          buildozer android debug
        env:
          BUILDOZER_ACCEPT_SDK_LICENSE: 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wincurl-apk
          path: bin/*.apk
