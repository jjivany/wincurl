name: Build and Deploy
on: [push]

jobs:


  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller pillow
      - name: Build with PyInstaller
        run: pyinstaller --name wincurl --onefile --windowed --add-data "icon.png;." --add-data "TwemojiMozilla.ttf;." --icon=icon.png main.py
      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: wincurl-windows
          path: dist/wincurl.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller pillow
      - name: Build with PyInstaller
        run: pyinstaller --name wincurl --onefile --windowed --add-data "icon.png:." --add-data "TwemojiMozilla.ttf:." --icon=icon.png main.py
      - name: Upload Mac Binary
        uses: actions/upload-artifact@v4
        with:
          name: wincurl-mac
          path: dist/wincurl.app

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller pillow
      - name: Build with PyInstaller
        run: pyinstaller --name wincurl --onefile --windowed --add-data "icon.png:." --add-data "TwemojiMozilla.ttf:." --icon=icon.png main.py
      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: wincurl-linux
          path: dist/wincurl

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pygbag and pygame
        run: pip install pygbag pygame ffmpeg-python
      - name: Synthesize Web Assets
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python generate_web_assets.py
      - name: Build WebAssembly
        run: |
          cp main.py icon.png patch_pygbag.py sc_driver.py wincurl_web/
          cd wincurl_web
          python patch_pygbag.py
          mv main-pygbag.py main.py
          cd ..
          pygbag --build wincurl_web
          cd wincurl_web/build/web
          rm -f wincurl_web.tar.gz
          mv wincurl_web.apk wincurl_web.data
          sed -i 's/"wincurl_web.apk"/"wincurl_web.data"/g' index.html
          sed -i 's/if platform.window.location.host.find(.*>.*0:/if True:/g' index.html
      - name: Upload Web Binary
        uses: actions/upload-artifact@v4
        with:
          name: wincurl-web
          path: wincurl_web/build/web

  deploy-itch:
    needs: [build-windows, build-mac, build-linux, build-web]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      ITCH_TARGET: jayjayivanygmailcom/wincurl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Install Butler
        run: |
          curl -L -o butler.zip https://github.com/itchio/butler/releases/download/v15.29.0/butler-linux-amd64.zip
          unzip butler.zip
          mv linux-amd64/butler .
          chmod +x butler
      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "BUTLER_API_KEY secret is not set. Skipping itch.io deployment."
            exit 0
          fi
          VERSION=$(grep -m 1 -oP 'VERSION\s*=\s*"\K[^"]+' main.py || echo "3.0 Build 62")
          ./butler push artifacts/wincurl-windows $ITCH_TARGET:windows --userversion "$VERSION"
          ./butler push artifacts/wincurl-mac $ITCH_TARGET:mac --userversion "$VERSION"
          ./butler push artifacts/wincurl-linux $ITCH_TARGET:linux --userversion "$VERSION"
          ./butler push artifacts/wincurl-web $ITCH_TARGET:html5 --userversion "$VERSION"
          ./butler push wincurl_latest.apk $ITCH_TARGET:android --userversion "$VERSION"
