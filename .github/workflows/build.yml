name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Setup Java (Required for Android)
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Setup Android SDK (This handles installation and licenses automatically)
      - uses: android-actions/setup-android@v3

      - name: Install Buildozer
        run: pip3 install --user --upgrade buildozer

      - name: Build with Buildozer
        run: |
          # Buildozer will now use the SDK provided by setup-android
          buildozer android debug
        env:
          BUILDOZER_ACCEPT_SDK_LICENSE: 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wincurl-apk
          path: bin/*.apk
