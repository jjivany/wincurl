name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: pip3 install --user --upgrade buildozer

      - name: Build with Buildozer
        run: |
          # 1. Clean environment
          rm -rf .buildozer
          
          # 2. Trigger SDK download (this will fail quickly, but it creates the folders we need)
          buildozer android debug || true
          
          # 3. Inject the licenses directly into the newly created SDK folder
          mkdir -p /home/runner/.android/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > /home/runner/.android/licenses/android-sdk-license
          
          # 4. Now run the build for real
          buildozer android debug
        env:
          BUILDOZER_ACCEPT_SDK_LICENSE: 1
