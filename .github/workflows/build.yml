name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This action encapsulates EVERYTHING. 
      # It spins up a container with the exact Java, SDK, and NDK versions Buildozer expects.
      - name: Build with Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      # The action automatically tracks the exact path of the generated APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wincurl-apk
          path: ${{ steps.buildozer.outputs.filename }}
