name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Build-Tools
        run: |
          # Install the specific build-tools that Buildozer needs
          sdkmanager "build-tools;33.0.0"

      - name: Bridge the gap for Buildozer
        run: |
          # Buildozer looks in a specific hidden folder for the SDK.
          # We create that folder and link it to the SDK setup-android just created.
          mkdir -p /home/runner/.buildozer/android/platform/
          ln -s $ANDROID_HOME /home/runner/.buildozer/android/platform/android-sdk

      - name: Install Buildozer
        run: pip3 install --user --upgrade buildozer

      - name: Build with Buildozer
        run: |
          buildozer android debug
        env:
          BUILDOZER_ACCEPT_SDK_LICENSE: 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wincurl-apk
          path: bin/*.apk
