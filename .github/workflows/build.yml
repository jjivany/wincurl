name: Build and Deploy
on: [push]

jobs:


  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pyinstaller pillow
      - name: Build with PyInstaller
        run: pyinstaller --name wincurl --onefile --windowed --add-data "icon.png;." --add-data "TwemojiMozilla.ttf;." --icon=icon.png main.py
      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: wincurl-windows
          path: dist/wincurl.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pyinstaller pillow
      - name: Build with PyInstaller
        run: pyinstaller --name wincurl --onefile --windowed --add-data "icon.png:." --add-data "TwemojiMozilla.ttf:." --icon=icon.png main.py
      - name: Create ZIP
        run: |
          cd dist
          zip -ry WinCurl-Mac.zip wincurl.app/
      - name: Upload Mac Binary
        uses: actions/upload-artifact@v4
        with:
          name: wincurl-mac
          path: dist/WinCurl-Mac.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pyinstaller pillow
      - name: Build with PyInstaller
        run: pyinstaller --name wincurl --onefile --windowed --add-data "icon.png:." --add-data "TwemojiMozilla.ttf:." --icon=icon.png main.py
      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: wincurl-linux
          path: dist/wincurl

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pygbag and pygame
        run: pip install pygbag==0.8.5 pygame-ce ffmpeg-python
      - name: Synthesize Web Assets
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python generate_web_assets.py
      - name: Build WebAssembly
        run: |
          python3 prepare_web_build.py
          rm -rf wincurl_web/build
          cp icon.png sc_driver.py sc_haptics.py portraits_data.py wincurl_web/
          cp main-pygbag.py wincurl_web/main.py
          python -m pygbag --build wincurl_web
          cd wincurl_web/build/web
          rm -f wincurl_web.tar.gz
          mv wincurl_web.apk wincurl_web.data
          sed -i 's/wincurl_web\.apk/wincurl_web.data/g' index.html
      - name: Upload Web Binary
        uses: actions/upload-artifact@v4
        with:
          name: wincurl-web
          path: wincurl_web/build/web/

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          brew install autoconf automake libtool pkg-config
          python -m pip install --upgrade pip
          pip install buildozer cython virtualenv kivy-ios sh pbxproj cookiecutter
      - name: Configure buildozer.spec for iOS
        run: |
          sed -i '' 's/requirements = python3==3.10.14,hostpython3==3.10.14,pygame,plyer,pyjnius/requirements = python3,sdl2,sdl2_image,sdl2_mixer,sdl2_ttf,pygame,plyer/' buildozer.spec
      - name: Build with Buildozer
        run: |
          buildozer ios debug
          mkdir -p bin Payload
          cp -r .buildozer/ios/platform/kivy-ios/wincurl3-ios/build/Debug-iphoneos/wincurl3.app Payload/
          zip -qr bin/wincurl-ios.ipa Payload
      - name: Upload iOS Binary
        uses: actions/upload-artifact@v4
        with:
          name: wincurl-ios
          path: bin/*.ipa


  deploy-itch:
    needs: [build-windows, build-mac, build-linux, build-web, build-ios]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ITCH_TARGET: jayjayivanygmailcom/wincurl
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts
      - name: Install Butler
        run: |
          curl -L -o butler.zip https://github.com/itchio/butler/releases/download/v15.29.0/butler-linux-amd64.zip
          unzip butler.zip
          mv linux-amd64/butler .
          chmod +x butler
      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "BUTLER_API_KEY secret is not set. Skipping itch.io deployment."
            exit 0
          fi
          VERSION=$(grep -m 1 -oP 'VERSION\s*=\s*"\K[^"]+' main.py || echo "3.0 Build 62")
          
          if [ -f "artifacts/wincurl-windows/wincurl.exe" ]; then
            ./butler push artifacts/wincurl-windows $ITCH_TARGET:windows --userversion "$VERSION"
          fi
          if [ -f "artifacts/wincurl-mac/WinCurl-Mac.zip" ]; then
            ./butler push artifacts/wincurl-mac/WinCurl-Mac.zip $ITCH_TARGET:mac --userversion "$VERSION"
          fi
          if [ -d "artifacts/wincurl-linux" ]; then
            ./butler push artifacts/wincurl-linux $ITCH_TARGET:linux --userversion "$VERSION"
          fi
          if [ -d "artifacts/wincurl-web" ]; then
            ./butler push artifacts/wincurl-web $ITCH_TARGET:html5 --userversion "$VERSION"
          fi
          if [ -d "artifacts/wincurl-ios" ]; then
            IPA_FILE=$(ls artifacts/wincurl-ios/*.ipa | head -n 1)
            if [ -n "$IPA_FILE" ]; then
              ./butler push "$IPA_FILE" $ITCH_TARGET:ios --userversion "$VERSION"
            fi
          fi
          if [ -f "wincurl_latest.apk" ]; then
            ./butler push wincurl_latest.apk $ITCH_TARGET:android --userversion "$VERSION"
          fi

