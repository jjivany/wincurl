Name: WinCurl
Summary: A fast-paced multiplayer curling game.
Description: |-
  WinCurl 3.0 introduces a massive overhaul to the classic curling formula. Featuring a 3D isometric view, advanced physics simulation, dynamic UI, cross-platform network matchmaking, and an epic RPG-lite Story Mode, WinCurl brings the strategic depth of real curling right to your screen.

RepoType: git
Repo: https://github.com/jjivany/wincurl

Builds:
  - versionName: 126.0.0
    versionCode: 126
    commit: v126
    sudo:
      - apt-get update || true
      - apt-get install -y python3 python3-pip python3-venv openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
    output: bin/wincurl3-3.0-arm64-v8a_armeabi-v7a-debug.apk
    build:
      - python3 -m venv .venv
      - . .venv/bin/activate
      - pip install buildozer cython
      - buildozer android debug

AutoUpdateMode: None
UpdateCheckMode: None
